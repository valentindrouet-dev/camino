name: Publier sur GitHub Pages

on:
  push:
    branches: [claude/camino-web-interface-a7765d, main]
    # Le commit automatique des fichiers construits ne doit pas relancer ce
    # workflow (sinon boucle infinie) : on ignore les pushes qui ne touchent
    # que le dossier assets/.
    paths-ignore:
      - 'assets/**'
      - '.nojekyll'
  workflow_dispatch:

permissions:
  contents: write

# Deux publications ne doivent pas se marcher dessus, mais on ne coupe pas
# celle qui est en cours : elle sert peut-être déjà le site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      # La source Pages de ce dépôt est « depuis la branche » (le jeton du
      # workflow n'a pas le droit d'en changer : HTTP 403). C'est donc ce
      # commit qui publie : GitHub reconstruit le site à chaque poussée.
      #
      # On a longtemps déposé EN PLUS un artefact déployé par actions/
      # deploy-pages. Les deux mécanismes se disputaient la même file : la
      # publication par la branche, déclenchée par le commit ci-dessous,
      # annulait le déploiement Actions resté en attente — d'où un workflow
      # en échec alors que le site, lui, était bien à jour. On ne garde donc
      # que la branche, et on vérifie le résultat pour de vrai.
      - name: Committer les fichiers construits sur la branche
        run: |
          rm -rf assets
          cp -r dist/assets assets
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets .nojekyll
          if git diff --cached --quiet; then
            echo "Aucun changement d'assets à publier."
          else
            git commit -m "Publication automatique des fichiers construits sur la branche"
            git push origin "HEAD:${GITHUB_REF_NAME}" ||
              (git pull --rebase origin "${GITHUB_REF_NAME}" &&
               git push origin "HEAD:${GITHUB_REF_NAME}")
          fi

      # Vérité terrain : on relit le site publié depuis l'extérieur. Tant que
      # l'application n'est pas réellement chargeable, la publication n'est
      # pas finie — et si elle ne l'est jamais, le workflow doit le dire.
      - name: Vérifier que le site en ligne sert une application qui démarre
        run: |
          URL="https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}/"
          ATTENDU=$(wc -c < dist/assets/camino.js)
          echo "Vérification de $URL (camino.js attendu : ${ATTENDU} octets)"
          for i in $(seq 1 60); do
            JS_SIZE=$(curl -fsSL "${URL}assets/camino.js?ci=${GITHUB_RUN_ID}-${i}" 2>/dev/null | wc -c || echo 0)
            HTML=$(curl -fsSL -H 'Cache-Control: no-cache' "${URL}?ci=${GITHUB_RUN_ID}-${i}" || true)
            if [ "$JS_SIZE" -eq "$ATTENDU" ] && echo "$HTML" | grep -q 'camino'; then
              echo "OK (tentative $i) : le site sert exactement le fichier qu'on vient de construire."
              exit 0
            fi
            echo "Tentative $i/60 : js=${JS_SIZE} octets (attendu ${ATTENDU}) — nouvel essai dans 10 s…"
            sleep 10
          done
          echo "ÉCHEC : l'application publiée ne correspond toujours pas après 10 minutes."
          exit 1
