<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAMINO — table de jeu &amp; laboratoire</title>
    <meta name="description" content="Interface de jeu, de playtest et d'équilibrage pour CAMINO." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='16' height='16' fill='%23F7931D'/><rect x='16' width='16' height='16' fill='%230095D9'/><rect y='16' width='16' height='16' fill='%2340AE49'/><rect x='16' y='16' width='16' height='16' fill='%23D1232A'/></svg>" />
    <style>
      /* Écran d'attente : le fond et le message existent avant même que la
         feuille de style de l'application ne soit chargée. */
      html,
      body {
        height: 100%;
        margin: 0;
        background: #fffdf5;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 14px;
        justify-items: center;
        text-align: center;
        padding: 24px;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #7d7161;
      }
      #boot .logo {
        display: grid;
        grid-template-columns: 1fr 1fr;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        overflow: hidden;
        animation: boot-spin 1.8s ease-in-out infinite;
      }
      #boot .logo i {
        display: block;
      }
      @keyframes boot-spin {
        50% {
          transform: rotate(180deg);
        }
      }
      #boot h1 {
        font-size: 15px;
        color: #33291f;
        margin: 0;
        letter-spacing: 0.22em;
      }
      #boot button {
        font: inherit;
        cursor: pointer;
        padding: 9px 18px;
        border-radius: 11px;
        border: 1px solid #eb8a12;
        background: #f7931d;
        color: #4a2a00;
        font-weight: 700;
      }
      #boot .fail {
        display: none;
      }
      #boot.failed .wait {
        display: none;
      }
      #boot.failed .fail {
        display: grid;
        gap: 12px;
        justify-items: center;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <span class="logo">
          <i style="background: #f7931d"></i><i style="background: #0095d9"></i>
          <i style="background: #40ae49"></i><i style="background: #d1232a"></i>
        </span>
        <div class="wait">
          <h1>CAMINO</h1>
          <p id="boot-note" style="margin: 0; font-size: 13px"></p>
        </div>
        <div class="fail">
          <h1>CAMINO</h1>
          <p style="max-width: 30em; margin: 0">
            L’application n’a pas réussi à se charger. C’est presque toujours une version restée en
            cache dans le navigateur.
          </p>
          <button onclick="location.replace(location.pathname + '?v=' + Date.now())">
            Recharger
          </button>
        </div>
      </div>
    </div>

    <script>
      /*
       * Filet de sécurité contre l'écran blanc — deux étages.
       *
       * 1. Si le script principal ne démarre pas (page servie par la
       *    publication « depuis la branche », qui expose le code source brut),
       *    on charge l'application depuis ./assets/camino.js : ces fichiers
       *    construits sont commités sur la branche par le workflow de
       *    publication, ils existent donc dans les deux modes de déploiement.
       * 2. Si même ce secours échoue (propagation du CDN en cours), on
       *    recharge tout seul, de plus en plus espacé, avant d'afficher un
       *    message avec un bouton.
       */
      ;(function () {
        var KEY = 'camino.boot-retry'
        var MAX_TRIES = 6
        var done = false
        var fallbackTried = false
        function started() {
          return document.documentElement.getAttribute('data-app') === 'ready'
        }
        function tries() {
          try {
            return parseInt(sessionStorage.getItem(KEY) || '0', 10) || 0
          } catch (e) {
            return MAX_TRIES
          }
        }
        function giveUp() {
          var boot = document.getElementById('boot')
          if (boot) boot.className = 'failed'
        }
        function reloadFresh() {
          location.replace(location.pathname + '?v=' + Date.now())
        }
        function recover() {
          if (done || started()) return
          done = true
          var n = tries()
          if (n >= MAX_TRIES) return giveUp()
          try {
            sessionStorage.setItem(KEY, String(n + 1))
          } catch (e) {
            return giveUp()
          }
          // Un déploiement met quelques minutes à se propager sur le CDN :
          // on réessaie tout seul, de plus en plus espacé (~0s, 5s, 20s, 45s…).
          var delay = n === 0 ? 0 : Math.min(n * n * 5000, 60000)
          if (delay > 0) {
            var note = document.getElementById('boot-note')
            if (note) note.textContent = 'Nouvelle tentative dans ' + Math.round(delay / 1000) + ' s…'
          }
          setTimeout(reloadFresh, delay)
        }
        // Étage 1 : démarrer l'application depuis les fichiers construits.
        function fallback() {
          if (started() || fallbackTried) return
          fallbackTried = true
          var css = document.createElement('link')
          css.rel = 'stylesheet'
          css.href = './assets/camino.css?fb=' + Date.now()
          document.head.appendChild(css)
          var js = document.createElement('script')
          js.type = 'module'
          js.src = './assets/camino.js?fb=' + Date.now()
          js.onerror = recover
          document.body.appendChild(js)
          // Si le secours ne démarre pas non plus, reprendre le cycle normal.
          setTimeout(recover, 5000)
        }
        // Un module qui ne se charge pas déclenche un « error » de ressource.
        window.addEventListener(
          'error',
          function (e) {
            if (e.target && e.target !== window && e.target.tagName === 'SCRIPT') fallback()
          },
          true,
        )
        setTimeout(fallback, 6000)
        window.addEventListener('load', function () {
          setTimeout(function () {
            if (!started()) return
            try {
              sessionStorage.removeItem(KEY)
            } catch (e) {
              /* navigation privée : sans importance */
            }
          }, 100)
        })
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
